<text x="498.0" y="141.0" font-size="13" fill="#f0f6fc"><tspan font-weight="600">10.39 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  0.0036 ꜩ / write</tspan></text>
<line x1="130" y1="52" x2="130" y2="154" stroke="#9198a1" stroke-width="1"/>
<text x="0" y="184" font-size="11" fill="#9198a1">Source: Pettersson, Exploring the Use of Blockchain Oracles in Physical Art Installations, CODE Berlin, 2022.</text>
