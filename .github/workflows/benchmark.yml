name: benchmark

on:
  push:
    branches: [main]
    paths: ["benchmark/**", "contracts/**", ".github/workflows/benchmark.yml"]
  pull_request:
    paths: ["benchmark/**", "contracts/**", ".github/workflows/benchmark.yml"]

defaults:
  run:
    working-directory: benchmark

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: benchmark/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  sandbox:
    name: run on sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: benchmark/package-lock.json
      - run: npm ci
      - run: npm run sandbox
      - name: Wait for the sandbox to produce blocks
        run: |
          for _ in $(seq 60); do
            level=$(curl -sf http://localhost:20000/chains/main/blocks/head/header | jq -r .level || true)
            [ "${level:-0}" -gt 1 ] && exit 0
            sleep 2
          done
          docker logs oracle-sandbox
          exit 1
      - run: npm start
        env:
          STEPS: 3
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: benchmark/results/*.csv
