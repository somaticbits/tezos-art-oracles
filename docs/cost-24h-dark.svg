<text x="328.9" y="73.0" font-size="13" fill="#f0f6fc"><tspan font-weight="600">5.51 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  0.0019 ꜩ / write</tspan></text>
<text x="118" y="107.0" font-size="13" text-anchor="end" fill="#f0f6fc">record + big_map</text>
