<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Simulated 24-hour cost per oracle storage design</title>
<desc id="d">big_map: 5.51 tez over 24 h, 0.0019 tez per write; record + big_map: 6.17 tez over 24 h, 0.0021 tez per write; map: 10.39 tez over 24 h, 0.0036 tez per write. One sensor, 2,880 writes, Flextesa sandbox, 2022.</desc>
<text x="0" y="20" font-size="15" font-weight="600" fill="#f0f6fc">Cost of one sensor writing every block for 24 h</text>
<text x="0" y="40" font-size="12" fill="#9198a1">2,880 add_data calls on a Flextesa sandbox, 2022 · tez (ꜩ)</text>
<text x="118" y="73.0" font-size="13" text-anchor="end" fill="#f0f6fc">big_map</text>
