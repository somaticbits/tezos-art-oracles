<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="720" height="214" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Projected 24-hour cost per oracle storage design</title>
<desc id="d">record + big_map: 1.12 tez projected over 24 h (1.11 fees, 0.00 storage burn), 387 mutez per write; map: 8.94 tez projected over 24 h (1.03 fees, 7.91 storage burn), 3,103 mutez per write; big_map: 49.33 tez projected over 24 h (1.05 fees, 48.28 storage burn), 17,129 mutez per write. One sensor, 2,880 writes, projected from 200 writes on a Flextesa Oxford sandbox, 2026.</desc>
<text x="0" y="20" font-size="15" font-weight="600" fill="#f0f6fc">Cost of one sensor writing every 30 s for 24 h</text>
<text x="0" y="40" font-size="12" fill="#9198a1">Projected from 200 add_data calls per contract on a Flextesa sandbox, 2026 · tez (ꜩ)</text>
<text x="118" y="73" font-size="13" text-anchor="end" fill="#f0f6fc">record + big_map</text>
<rect x="130" y="58" width="7.4" height="22" fill="#7d8590"/>
<text x="145.5" y="73" font-size="13" fill="#f0f6fc"><tspan font-weight="600">≈ 1.1 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  387 µꜩ / write</tspan></text>
<text x="118" y="107" font-size="13" text-anchor="end" fill="#f0f6fc">map</text>
<rect x="130" y="92" width="6.9" height="22" fill="#7d8590"/>
<rect x="136.9" y="92" width="52.9" height="22" fill="#3987e5"/>
<text x="197.8" y="107" font-size="13" fill="#f0f6fc"><tspan font-weight="600">≈ 8.9 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  3,103 µꜩ / write</tspan></text>
<text x="118" y="141" font-size="13" text-anchor="end" fill="#f0f6fc">big_map</text>
<rect x="130" y="126" width="7.0" height="22" fill="#7d8590"/>
<rect x="137.0" y="126" width="323.0" height="22" fill="#3987e5"/>
<text x="468.0" y="141" font-size="13" fill="#f0f6fc"><tspan font-weight="600">≈ 49.3 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  17,129 µꜩ / write</tspan></text>
<line x1="130" y1="52" x2="130" y2="154" stroke="#9198a1" stroke-width="1"/>
<rect x="130" y="163" width="10" height="10" fill="#7d8590"/><text x="146" y="172" font-size="12" fill="#9198a1">baker fee</text>
<rect x="220" y="163" width="10" height="10" fill="#3987e5"/><text x="236" y="172" font-size="12" fill="#9198a1">storage burn</text>
<text x="0" y="202" font-size="11" fill="#9198a1">Map gas rises with every write, so its real 24 h fee is higher than projected. Thesis figures (2022) are in the README.</text>
</svg>
