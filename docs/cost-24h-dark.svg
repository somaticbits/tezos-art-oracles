<text x="351.8" y="107.0" font-size="13" fill="#f0f6fc"><tspan font-weight="600">6.17 ꜩ</tspan><tspan fill="#9198a1" font-size="12">  0.0021 ꜩ / write</tspan></text>
<text x="118" y="141.0" font-size="13" text-anchor="end" fill="#f0f6fc">map</text>
